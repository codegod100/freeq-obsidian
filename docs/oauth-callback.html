<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FreeQ OAuth — Redirecting...</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			display: flex; align-items: center; justify-content: center;
			min-height: 100vh;
			background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
			padding: 1rem;
		}
		.container {
			text-align: center; padding: 3rem 2rem;
			background: #0b1220; border: 1px solid #1e293b;
			border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
			max-width: 500px; width: 100%; color: #e2e8f0;
		}
		h1 { color: #38bdf8; margin: 0 0 1rem 0; font-size: 1.75rem; font-weight: 600; }
		.spinner {
			margin: 2rem auto; width: 50px; height: 50px;
			border: 4px solid #1e293b; border-top: 4px solid #38bdf8;
			border-radius: 50%; animation: spin 1s linear infinite;
		}
		@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
		p { color: #94a3b8; margin: 1rem 0; line-height: 1.6; }
		.manual-link {
			margin-top: 2rem; padding: 1rem;
			background: #0f172a; border-radius: 8px;
			border: 1px solid #1e293b; display: none;
		}
		.manual-link.show { display: block; }
		.link-text {
			word-break: break-all; font-family: monospace;
			font-size: 0.85rem; color: #e2e8f0;
			padding: 0.5rem; background: #0b1220;
			border-radius: 4px; margin-top: 0.5rem;
		}
		button {
			margin-top: 1rem; padding: 0.75rem 1.5rem;
			background: #38bdf8; color: #0f172a;
			border: none; border-radius: 8px;
			font-size: 1rem; font-weight: 600;
			cursor: pointer; transition: background 0.2s;
		}
		button:hover { background: #7dd3fc; }
	</style>
</head>
<body>
	<div class="container">
		<h1>✅ Authentication Successful!</h1>
		<div class="spinner"></div>
		<p id="status">Redirecting to Obsidian...</p>
		<div class="manual-link" id="manual-link">
			<p>If Obsidian doesn't open automatically:</p>
			<p style="font-size: 0.9rem; margin-bottom: 0.5rem;">1. Copy the link below</p>
			<div class="link-text" id="link-text"></div>
			<button onclick="copyLink()">Copy Link</button>
			<p style="font-size: 0.9rem; margin-top: 1rem;">2. Paste it in Obsidian's command palette or a note and Ctrl/Cmd-click it</p>
		</div>
	</div>

	<script>
		(function() {
			try {
				// FreeQ broker returns OAuth data in URL hash as #oauth=BASE64URL
				const params = new URLSearchParams(window.location.hash.slice(1));
				const oauthData = params.get('oauth');

				if (!oauthData) {
					throw new Error('No OAuth data found in URL');
				}

				// Build obsidian:// URI with the raw base64 data
				const obsidianUri = `obsidian://freeq-chat?oauth=${encodeURIComponent(oauthData)}`;

				document.getElementById('link-text').textContent = obsidianUri;
				window.location.href = obsidianUri;

				setTimeout(function() {
					const spinner = document.querySelector('.spinner');
					if (spinner) spinner.style.display = 'none';
					document.querySelector('h1').textContent = '✅ Redirected!';
					document.getElementById('status').textContent = 'Return to Obsidian to complete login.';
					setTimeout(function() {
						try { window.close(); } catch (e) {
							document.getElementById('status').textContent = 'You can close this window now.';
						}
					}, 500);
				}, 500);

				setTimeout(function() {
					document.getElementById('manual-link').classList.add('show');
				}, 3000);
			} catch (error) {
				console.error('Redirect error:', error);
				document.querySelector('.spinner').style.display = 'none';
				document.getElementById('status').textContent = 'An error occurred during redirect: ' + error.message;
				document.getElementById('manual-link').classList.add('show');
			}
		})();

		function copyLink() {
			const linkText = document.getElementById('link-text').textContent;
			navigator.clipboard.writeText(linkText).then(function() {
				const btn = event.target;
				btn.textContent = '✓ Copied!';
				setTimeout(function() { btn.textContent = 'Copy Link'; }, 2000);
			}).catch(function(err) {
				console.error('Failed to copy:', err);
				alert('Failed to copy. Please select and copy the link manually.');
			});
		}
	</script>
</body>
</html>
