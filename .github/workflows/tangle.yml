name: Tangle

on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  tangle:
    runs-on: ubuntu-latest
    steps:
      - uses: gwennlbh/to-tangled@v0.5
        with:
          repo: nandi.latha.org/freeq-obsidian
          knot: tangled.org
          ssh-key: ${{ secrets.TANGLED_KEY }}
